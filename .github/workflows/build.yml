name: Build deployment modules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: commerce-deployment
          path: releases/commerce.tar.gz
          if-no-files-found: error
          retention-days: 7
